name: Publish v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build and test
        shell: powershell
        run: |
          .\build_exe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tests\logic.tests.ps1
          .\tests\build.tests.ps1
          $builtExe = Get-ChildItem -Recurse -Filter '*.exe' |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            Select-Object -First 1
          if ($null -eq $builtExe) { throw 'Built executable was not found.' }
          Compress-Archive -Path (Join-Path $builtExe.Directory.FullName '*') `
            -DestinationPath '.\CityUdg-timetable-to-ics-v1.1.0.zip' -Force

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 '.\CityUdg-timetable-to-ics-v1.1.0.zip' `
            --target $env:GITHUB_SHA `
            --title 'v1.1.0 - Safer launcher and application icon' `
            --notes-file '.\RELEASE_NOTES_v1.1.0.md'
